schema = 2
# One short cue per catalog skill for the per-request skill check. The model
# judges which skills apply, in whatever language the request uses; nothing
# here matches the user's words. Every catalog skill appears exactly once, and
# the order is the order of the check.

[[skills]]
skill = "skill/evidence-research"
cue = "current external facts, existing solutions or comparing options"

