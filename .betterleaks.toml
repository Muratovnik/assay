# Verified SHA-256 identities in the durability evidence, not credentials:
# d49 and d51 decision memos; the synthetic Spanport OpenAPI source.
# Keep detection active for every other value and outside these evidence files.
# Task-completion evidence adds 15 recomputed file digests and six recomputed
# canonical JSON digests. These exact values are public provenance, and are
# filtered only inside the two named evidence archives and only for generic-api-key.
filter = '''
finding["rule_id"] == "generic-api-key" &&
(
