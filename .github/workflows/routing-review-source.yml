name: Routing review source

on:
  push:
    branches: [fix/routing-pipeline-enforcement]

permissions:
  contents: read

jobs:
  dependencies:
    if: >-
      startsWith(github.event.head_commit.message, 'chore(routing): prepare isolated SDK')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download pinned MCP verification dependencies
        run: python -m pip download --python-version 3.13 --only-binary=:all: --dest routing-wheels -r skills/route-subagents/scripts/requirements-mcp.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routing-sdk-wheels
          path: routing-wheels
          retention-days: 1
