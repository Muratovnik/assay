name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history gate cannot inspect what a shallow clone did not fetch.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-tools.txt
      - name: Every gate
        run: python -B tools/check.py --all
      - name: Publication audit
        run: python .github/relkit.pyz audit --history
      - name: Claude plugin manifests
        if: runner.os == 'Linux'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
