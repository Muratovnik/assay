name: FrontierCode public acquisition probe

on:
  push:
    branches: ["audit/frontiercode-public-24671e3"]
    paths:
      - ".github/workflows/frontiercode-public-probe.yml"
      - "tools/frontiercode_public_probe.py"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the isolated production browser dependency
        timeout-minutes: 6
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/assay-public-source-env"
          "$RUNNER_TEMP/assay-public-source-env/bin/python" -m pip install --disable-pip-version-check -r skills/route-subagents/scripts/requirements-browser.txt
          "$RUNNER_TEMP/assay-public-source-env/bin/python" -m playwright install --with-deps chromium
      - name: Acquire FrontierCode once and verify offline reread
        timeout-minutes: 2
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: '"$RUNNER_TEMP/assay-public-source-env/bin/python" -B tools/frontiercode_public_probe.py --repo "$GITHUB_WORKSPACE"'
