[exposure]
# Scratch, evidence and personal client settings never belong in the library.
# Probe paths inside each directory rather than the directory itself: a
# directory-only rule matches nothing until the directory exists, and in a fresh
# clone it does not.
required_ignores = [
  ".cache/scanners",
  ".claude/settings.local.json",
  ".private/manifest.json",
  "tmp/scratch",
]
allowed_identities = [
  "Nikolai Muratov <el.muratovnik@gmail.com>",
  "Muratovnik <68428072+Muratovnik@users.noreply.github.com>",
]
forbid_ai_attribution = true
forbid_internal_planning = true
forbid_machine_observations = true
betterleaks_config = ".betterleaks.toml"
