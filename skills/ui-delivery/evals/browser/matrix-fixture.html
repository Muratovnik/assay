<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orders: filters panel</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 14px/20px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2937; background: #f5f6f8; }
  #app { display: grid; grid-template-columns: 248px minmax(0, 1fr) auto; min-height: 100vh; }
  #nav { background: #1e2533; color: #d6dbe4; padding: 20px 16px; }
  #nav ul { list-style: none; margin: 0; padding: 0; }
  #nav li { padding: 6px 0; }
  #main { padding: 24px; min-width: 0; }
  #top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #top h1 { font-size: 20px; line-height: 28px; margin: 0; }
  button, select { font: inherit; padding: 6px 12px; border: 1px solid #c8cfda; border-radius: 6px; background: #fff; }
  #order-list { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 560px; max-height: 260px; overflow-y: auto; }
  .card { flex: none; background: #fff; border: 1px solid #d9dee6; border-radius: 6px; padding: 10px 12px; }
  .card-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; overflow-wrap: anywhere; }
  .fault .card-title { white-space: nowrap; }
  .card-meta { color: #5b6574; font-size: 13px; }
  #filters-panel { width: 360px; background: #fff; border-left: 1px solid #d9dee6; padding: 24px; }
  #filters-panel:not([hidden]) { animation: slide-in 200ms ease-out; }
  @keyframes slide-in { from { transform: translateX(24px); } to { transform: none; } }
  #panel-title { font-size: 16px; line-height: 24px; margin: 0 0 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
  .field label { font-size: 12px; line-height: 16px; color: #5b6574; font-weight: 600; }
  .field select { width: 100%; }
</style>
</head>
<body>
<div id="app">
  <nav id="nav"><ul><li>Overview</li><li>Orders</li><li>Reports</li></ul></nav>
  <main id="main">
    <header id="top">
      <h1 id="page-title">Orders</h1>
      <button id="open-panel" type="button" aria-controls="filters-panel" aria-expanded="false">Filters</button>
    </header>
    <div id="order-list" tabindex="0" aria-label="Orders"></div>
  </main>
  <aside id="filters-panel" hidden aria-labelledby="panel-title">
    <h2 id="panel-title">Filters</h2>
    <div class="field"><label id="label-period" for="period">Period</label>
      <select id="period"><option>Today</option><option>This week</option></select></div>
    <div class="field"><label id="label-status" for="status">Status</label>
      <select id="status"><option>Any status</option><option>Waiting</option></select></div>
    <div class="field"><label id="label-owner" for="owner">Dispatcher</label>
      <select id="owner"><option>Anyone</option><option>Me</option></select></div>
  </aside>
</div>
<script>
{ // A block, so that loading the page again into the same window declares nothing twice.
  const { variant, orders } = window.fixture;
  if (!['fault', 'control'].includes(variant)) throw new Error('Unknown fixture variant');
  document.body.className = variant;
  const list = document.getElementById('order-list');
  orders.forEach(({ title, meta }, index) => {
    const card = Object.assign(document.createElement('div'), { id: `order-${index + 1}`, className: 'card' });
    card.append(Object.assign(document.createElement('div'), { className: 'card-title', textContent: title }),
      Object.assign(document.createElement('div'), { className: 'card-meta', textContent: meta }));
    list.append(card);
  });
  document.getElementById('open-panel').addEventListener('click', (event) => {
    const panel = document.getElementById('filters-panel');
    panel.hidden = !panel.hidden;
    event.currentTarget.setAttribute('aria-expanded', String(!panel.hidden));
  });
}
</script>
</body>
</html>
